name: Galeri thumbnail olustur

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/italyanboya*'
      - 'assets/satinart*'
      - 'scripts/build_gallery.py'
      - '.github/workflows/gallery-thumbnails.yml'

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow kur
        run: python -m pip install --upgrade pillow

      - name: Thumbnail ve manifest olustur
        run: python scripts/build_gallery.py

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thumbs assets/gallery-manifest.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Galeri thumbnail dosyalarini guncelle"
            git push
          fi
